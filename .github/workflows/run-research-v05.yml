name: Asia GARP v0.5.1 | 5 Markets + Evidence + Valuation (Research Only)
on:
  workflow_dispatch:
    inputs:
      discovery_only:
        description: 'Fetch listings and publish diagnostics without financial analysis'
        type: boolean
        default: false
      china_only:
        description: 'Limit discovery-only diagnostics to mainland China'
        type: boolean
        default: false
      max_symbols:
        description: 'Max fetched stocks; 150 recommended; 0=all discovered (may be slow)'
        required: true
        default: '150'
        type: string
      discover_mode:
        description: 'Exchange sources and optional publisher exports, plus regional vendor samples'
        required: true
        default: all5_official
        type: choice
        options: ['all5_official', 'all5', 'regional5', 'nikkei', 'off']
      per_region:
        description: 'Per market maximum Yahoo screener results (not full exchange census)'
        required: true
        default: '90'
        type: string
      evidence_mode:
        description: 'full=RSS headlines, vendor quarter, DART filing index with optional secret'
        required: true
        default: full
        type: choice
        options: ['full', 'news', 'off']
      fx_mode:
        description: 'Current spot and flow-proxy conversion; not verified financial restatement'
        required: true
        default: live
        type: choice
        options: ['live', 'off']
permissions:
  contents: read
concurrency:
  group: asia-garp-v051-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrated_research:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install reproducible runtime
        run: python -m pip install -r requirements.txt
      - name: Regression and quality gate tests
        run: python -m pytest -q tests
      - name: Integrated three-stage research / no orders
        if: ${{ !inputs.discovery_only }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          KRX_BASE_DATE: ${{ vars.KRX_BASE_DATE }}
          GARP_LISTING_EXPORT_DIR: ${{ vars.GARP_LISTING_EXPORT_DIR }}
          GARP_ENABLE_BAOSTOCK: ${{ vars.GARP_ENABLE_BAOSTOCK }}
          GARP_TUSHARE_EXPORT_DIR: ${{ vars.GARP_TUSHARE_EXPORT_DIR }}
          GARP_BAOSTOCK_SNAPSHOT: ${{ vars.GARP_BAOSTOCK_SNAPSHOT }}
          GARP_INPUT_EVIDENCE_MODE: ${{ inputs.evidence_mode }}
          GARP_INPUT_FX_MODE: ${{ inputs.fx_mode }}
          GARP_INPUT_PER_REGION: ${{ inputs.per_region }}
          GARP_INPUT_DISCOVER_MODE: ${{ inputs.discover_mode }}
          GARP_INPUT_MAX_SYMBOLS: ${{ inputs.max_symbols }}
        run: |
          python -m src.v051 \
            --max-symbols "$GARP_INPUT_MAX_SYMBOLS" \
            --discover-mode "$GARP_INPUT_DISCOVER_MODE" \
            --per-region "$GARP_INPUT_PER_REGION" \
            --fx-mode "$GARP_INPUT_FX_MODE" \
            --evidence-mode "$GARP_INPUT_EVIDENCE_MODE" \
            --evidence-limit 8 \
            --delay-seconds 0.7 \
            --output outputs
      - name: Listing discovery only
        if: ${{ inputs.discovery_only }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          KRX_BASE_DATE: ${{ vars.KRX_BASE_DATE }}
          GARP_LISTING_EXPORT_DIR: ${{ vars.GARP_LISTING_EXPORT_DIR }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          GARP_TUSHARE_EXPORT_DIR: ${{ vars.GARP_TUSHARE_EXPORT_DIR }}
          GARP_BAOSTOCK_SNAPSHOT: ${{ vars.GARP_BAOSTOCK_SNAPSHOT }}
          GARP_CHINA_ONLY: ${{ inputs.china_only }}
        run: |
          if [[ "$GARP_CHINA_ONLY" == true ]]; then
            python -m src.discovery_smoke --output outputs --china-only
          else
            python -m src.discovery_smoke --output outputs
          fi
      - name: Require quality audit & zero autonomous trading
        if: ${{ !inputs.discovery_only }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('outputs/34_research_quality_v05.json').read_text())
          assert q['trade_orders']=='NONE'
          assert q['future_return_predictive_validation']=='NOT_PERFORMED'
          r=json.loads(Path('outputs/42_research_readiness_v051.json').read_text())
          assert r['official_financial_figures_machine_verified_n']==0
          assert r['full_five_market_census_verified'] is False
          assert r['trades_executed'] is False
          assert Path('outputs/44_v051_run_manifest.json').is_file()
          print('PASS stage gate:',q['screened_n'],'screened,',q['memo_ready_n'],'memo ready')
          if r['market_coverage_status']=='PARTIAL_COVERAGE':
              print('::warning::PARTIAL_COVERAGE — missing official listings for', ','.join(r['markets_without_retrieved_official_issuer_list']))
          print('Market coverage:',r['market_coverage_status'],'dominant:',r['dominant_market'],r['dominant_market_share_pct'])
          PY
      - name: Upload research artifacts (including troubleshooting artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-garp-v051-${{ github.run_id }}
          path: outputs/
          retention-days: 30
          if-no-files-found: warn
