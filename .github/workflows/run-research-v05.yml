name: Asia GARP v0.5 | Discovery + Evidence + Valuation (Research Only)
on:
  workflow_dispatch:
    inputs:
      max_symbols:
        description: 'Max fetched stocks; 150 recommended; 0=all discovered (may be slow)'
        required: true
        default: '150'
        type: string
      discover_mode:
        description: 'Supplemental official JPX/TWSE plus regional vendor search of 5 markets'
        required: true
        default: all5_official
        type: choice
        options: [all5_official, all5, regional5, nikkei, off]
      per_region:
        description: 'Per market maximum Yahoo screener results (not full exchange census)'
        required: true
        default: '90'
        type: string
      evidence_mode:
        description: 'full=RSS headlines, vendor quarter, DART filing index with optional secret'
        required: true
        default: full
        type: choice
        options: [full, news, off]
      fx_mode:
        description: 'Current spot and flow-proxy conversion; not verified financial restatement'
        required: true
        default: live
        type: choice
        options: [live, off]
permissions:
  contents: read
concurrency:
  group: asia-garp-v05-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrated_research:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install reproducible runtime
        run: python -m pip install -r requirements.txt
      - name: Regression and quality gate tests
        run: python -m pytest -q tests
      - name: Integrated three-stage research / no orders
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          KRX_BASE_DATE: ${{ vars.KRX_BASE_DATE }}
        run: |
          python -m src.v05 \
            --max-symbols "${{ inputs.max_symbols }}" \
            --discover-mode "${{ inputs.discover_mode }}" \
            --per-region "${{ inputs.per_region }}" \
            --fx-mode "${{ inputs.fx_mode }}" \
            --evidence-mode "${{ inputs.evidence_mode }}" \
            --evidence-limit 8 \
            --delay-seconds 0.7 \
            --output outputs
      - name: Require quality audit & zero autonomous trading
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('outputs/34_research_quality_v05.json').read_text())
          assert q['trade_orders']=='NONE'
          assert q['future_return_predictive_validation']=='NOT_PERFORMED'
          print('PASS quality guard:',q['screened_n'],'screened,',q['memo_ready_n'],'memo ready')
          PY
      - name: Upload research artifacts (including troubleshooting artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-garp-v05-${{ github.run_id }}
          path: outputs/
          retention-days: 30
          if-no-files-found: warn
