name: Asia GARP v0.6 | 5 Markets + Evidence + Valuation (Research Only)
on:
  workflow_dispatch:
    inputs:
      cycle_mode:
        description: 'Optional durable research cycle action'
        type: choice
        default: off
        options: ['off', 'initialize', 'batch', 'aggregate']
      cycle_state:
        description: 'Workflow run ID that initialized the immutable cycle'
        type: string
        default: ''
      cycle_market:
        description: 'Market filter for the next durable cycle dispatch'
        type: choice
        default: All
        options: ['All', 'China', 'Hong Kong', 'Japan', 'Korea', 'Taiwan']
      discovery_only:
        description: 'Fetch listings and publish diagnostics without financial analysis'
        type: boolean
        default: false
      china_only:
        description: 'Limit discovery-only diagnostics to mainland China'
        type: boolean
        default: false
      china_provider_probe:
        description: 'Run minimal independent-provider probes in China-only discovery'
        type: boolean
        default: false
      enable_tushare_research:
        description: 'Allow an already validated Tushare token in normal official research'
        type: boolean
        default: false
      use_private_listing_bundle:
        description: 'Retrieve and validate authorized listing files from a pinned private data repository'
        type: boolean
        default: false
      legacy_research:
        description: 'Run the v0.5.1 engine directly'
        type: boolean
        default: false
      full_universe:
        description: 'Select the full discovered universe, subject to the financial budget'
        type: boolean
        default: false
      financial_budget:
        description: 'Maximum vendor fetch attempts'
        type: string
        default: '25'
      research_asof:
        description: 'Optional UTC research date (YYYY-MM-DD)'
        type: string
        default: ''
      report_limit:
        description: 'Maximum candidates in the v0.6 shortlist (1-5)'
        type: string
        default: '5'
      filing_budget:
        description: 'Maximum scheduled primary filing downloads (0-10)'
        type: string
        default: '0'
      enable_gemini:
        description: 'Send approved filing passages to Gemini (requires GEMINI_API_KEY)'
        type: boolean
        default: false
      gemini_approved_only:
        description: 'Allow explicit dated approvals without a screening shortlist'
        type: boolean
        default: false
      gemini_approved_sources:
        description: 'Path to an approved source CSV in the checked-out repository'
        type: string
        default: ''
      gemini_max_documents:
        description: 'Maximum approved filing documents (1-3)'
        type: string
        default: '1'
      gemini_max_requests:
        description: 'Maximum Gemini calls including retries (1-9)'
        type: string
        default: '2'
      official_filing_requests:
        description: 'Path to the reviewed official filing request CSV in the checkout'
        type: string
        default: ''
      max_symbols:
        description: 'Maximum selected securities in bounded mode'
        required: true
        default: '25'
        type: string
      discover_mode:
        description: 'Exchange sources and optional publisher exports, plus regional vendor samples'
        required: true
        default: all5_official
        type: choice
        options: ['all5_official', 'all5', 'regional5', 'nikkei', 'off']
      per_region:
        description: 'Per market maximum Yahoo screener results (not full exchange census)'
        required: true
        default: '90'
        type: string
      evidence_mode:
        description: 'full=RSS headlines, vendor quarter, DART filing index with optional secret'
        required: true
        default: full
        type: choice
        options: ['full', 'news', 'off']
      fx_mode:
        description: 'Current spot and flow-proxy conversion; not verified financial restatement'
        required: true
        default: live
        type: choice
        options: ['live', 'off']
permissions:
  contents: read
  actions: read
concurrency:
  group: asia-garp-research-${{ inputs.cycle_state || github.ref }}
  cancel-in-progress: false
jobs:
  integrated_research:
    if: ${{ inputs.cycle_mode == 'off' || inputs.cycle_mode == 'initialize' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install reproducible runtime
        run: python -m pip install -r requirements.txt -r requirements-gemini.txt
      - name: Regression and quality gate tests
        run: python -m pytest -q tests tests_gemini
      - name: Check private listing bundle configuration
        id: listing_bundle_config
        if: ${{ inputs.use_private_listing_bundle }}
        env:
          LISTING_DATA_REPOSITORY: ${{ vars.GARP_LISTING_DATA_REPOSITORY }}
          LISTING_DATA_REF: ${{ vars.GARP_LISTING_DATA_REF }}
          LISTING_DATA_TOKEN: ${{ secrets.GARP_LISTING_DATA_TOKEN }}
          LISTING_ARTIFACTS_ALLOWED: ${{ vars.GARP_LISTING_ARTIFACTS_ALLOWED }}
        run: |
          if [[ "$LISTING_ARTIFACTS_ALLOWED" != '1' ]]; then
            printf '%s\n' '::warning::Private listing bundle skipped. Set GARP_LISTING_ARTIFACTS_ALLOWED=1 only when the provider permits derived listing logs and artifacts in this repository.'
          elif [[ "$LISTING_DATA_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ &&
                  "$LISTING_DATA_REF" =~ ^[0-9a-fA-F]{40}$ &&
                  -n "$LISTING_DATA_TOKEN" ]]; then
            if [[ "$(GH_TOKEN="$LISTING_DATA_TOKEN" gh api --hostname github.com "repos/$LISTING_DATA_REPOSITORY" --jq '.private' 2>/dev/null)" == true ]]; then
              printf 'ready=true\n' >> "$GITHUB_OUTPUT"
            else
              printf '%s\n' '::warning::Could not confirm that the data repository is private and readable. Continuing without the private input.'
            fi
          else
            printf '%s\n' '::warning::Private listing bundle requires owner/repository, a full commit SHA and a contents-read token. Continuing with configured discovery routes.'
          fi
      - name: Check out private listing bundle
        id: listing_bundle_checkout
        if: ${{ steps.listing_bundle_config.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GARP_LISTING_DATA_REPOSITORY }}
          ref: ${{ vars.GARP_LISTING_DATA_REF }}
          token: ${{ secrets.GARP_LISTING_DATA_TOKEN }}
          path: .garp-inputs
          persist-credentials: false
      - name: Validate private listing bundle
        id: listing_bundle
        if: ${{ steps.listing_bundle_checkout.outcome == 'success' }}
        env:
          LISTING_DATA_REF: ${{ vars.GARP_LISTING_DATA_REF }}
        run: |
          bundle_outputs="$(mktemp "$RUNNER_TEMP/garp-listing-outputs.XXXXXX")"
          if [[ "$(git -C .garp-inputs rev-parse HEAD)" == "${LISTING_DATA_REF,,}" ]] &&
              GITHUB_OUTPUT="$bundle_outputs" python -m src.china_listing_bundle --input .garp-inputs --output "$RUNNER_TEMP/garp-validated-inputs"; then
            cat "$bundle_outputs" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' '::warning::Private listing bundle validation failed. Continuing without the private input.'
          fi
          rm -f "$bundle_outputs"
      - name: Report private listing checkout failure
        if: ${{ steps.listing_bundle_checkout.outcome == 'failure' }}
        run: printf '%s\n' '::warning::Private listing checkout failed. Continuing without the private input.'
      - name: Integrated three-stage research / no orders
        if: ${{ !inputs.discovery_only && inputs.cycle_mode == 'off' }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          EDINET_API_KEY: ${{ !inputs.legacy_research && inputs.official_filing_requests != '' && secrets.EDINET_API_KEY || '' }}
          GEMINI_API_KEY: ${{ !inputs.legacy_research && inputs.enable_gemini && secrets.GEMINI_API_KEY || '' }}
          GARP_GEMINI_MODEL: ${{ vars.GARP_GEMINI_MODEL }}
          GARP_DOSSIER: ${{ vars.GARP_RESEARCH_DOSSIER }}
          GARP_GEMINI_MAX_COST: ${{ vars.GARP_GEMINI_MAX_COST_USD }}
          GARP_INPUT_GEMINI: ${{ inputs.enable_gemini }}
          GARP_INPUT_GEMINI_APPROVED_ONLY: ${{ inputs.gemini_approved_only }}
          GARP_INPUT_GEMINI_APPROVALS: ${{ inputs.gemini_approved_sources }}
          GARP_INPUT_GEMINI_MAX_DOCUMENTS: ${{ inputs.gemini_max_documents }}
          GARP_INPUT_GEMINI_MAX_REQUESTS: ${{ inputs.gemini_max_requests }}
          GARP_GEMINI_TOTAL_INPUT_BUDGET: ${{ vars.GARP_GEMINI_TOTAL_INPUT_BUDGET }}
          GARP_GEMINI_TOTAL_OUTPUT_BUDGET: ${{ vars.GARP_GEMINI_TOTAL_OUTPUT_BUDGET }}
          GARP_GEMINI_INPUT_PRICE: ${{ vars.GARP_GEMINI_INPUT_PRICE }}
          GARP_GEMINI_OUTPUT_PRICE: ${{ vars.GARP_GEMINI_OUTPUT_PRICE }}
          GARP_INPUT_FILING_REQUESTS: ${{ inputs.official_filing_requests }}
          GARP_INPUT_FILING_BUDGET: ${{ inputs.filing_budget }}
          GARP_INPUT_VENDOR_EXPORT: ${{ vars.GARP_FILING_VENDOR_EXPORT }}
          GARP_INPUT_CLASSIFICATION: ${{ vars.GARP_CLASSIFICATION_REGISTRY }}
          GARP_INPUT_DART_REQUESTS: ${{ vars.GARP_OPENDART_REQUESTS }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          KRX_BASE_DATE: ${{ vars.KRX_BASE_DATE }}
          GARP_LISTING_EXPORT_DIR: ${{ vars.GARP_LISTING_EXPORT_DIR }}
          GARP_VALIDATED_CHINA_PUBLISHER_DIR: ${{ steps.listing_bundle.outputs.publisher_dir }}
          GARP_ENABLE_BAOSTOCK: ${{ vars.GARP_ENABLE_BAOSTOCK }}
          QUANTSONAR_API_KEY: ${{ vars.GARP_ENABLE_QUANTSONAR_RESEARCH == '1' && secrets.QUANTSONAR_API_KEY || '' }}
          TUSHARE_TOKEN: ${{ inputs.enable_tushare_research && secrets.TUSHARE_TOKEN || '' }}
          GARP_TUSHARE_EXPORT_DIR: ${{ vars.GARP_TUSHARE_EXPORT_DIR }}
          GARP_VALIDATED_CHINA_VENDOR_DIR: ${{ steps.listing_bundle.outputs.vendor_dir }}
          GARP_BAOSTOCK_SNAPSHOT: ${{ vars.GARP_BAOSTOCK_SNAPSHOT }}
          GARP_INPUT_EVIDENCE_MODE: ${{ inputs.evidence_mode }}
          GARP_INPUT_FX_MODE: ${{ inputs.fx_mode }}
          GARP_INPUT_PER_REGION: ${{ inputs.per_region }}
          GARP_INPUT_DISCOVER_MODE: ${{ inputs.discover_mode }}
          GARP_INPUT_ASOF: ${{ inputs.research_asof }}
          GARP_INPUT_REPORT_LIMIT: ${{ inputs.report_limit }}
          GARP_INPUT_LEGACY: ${{ inputs.legacy_research }}
          GARP_INPUT_FULL: ${{ inputs.full_universe }}
          GARP_INPUT_FINANCIAL_BUDGET: ${{ inputs.financial_budget }}
          GARP_INPUT_MAX_SYMBOLS: ${{ inputs.max_symbols }}
          GARP_INPUT_MARKET: ${{ inputs.cycle_market }}
        run: |
          engine=(python -m src.v06)
          extra=(--report-limit "$GARP_INPUT_REPORT_LIMIT" --financial-budget "$GARP_INPUT_FINANCIAL_BUDGET" --checkpoint "$RUNNER_TEMP/garp-financial.sqlite")
          if [[ "$GARP_INPUT_FULL" == true ]]; then
            extra+=(--full-universe)
          fi
          if [[ "$GARP_INPUT_LEGACY" == true ]]; then
            engine=(python -m src.v051)
            extra=()
            if [[ "$GARP_INPUT_FULL" == true ]]; then
              GARP_INPUT_MAX_SYMBOLS=0
            fi
          fi
          if [[ "$GARP_INPUT_LEGACY" != true ]]; then
            checked_csv() {
              local path
              path="$(realpath -e -- "$1")" || return 1
              [[ "$path" == "$GITHUB_WORKSPACE/"*.csv && -f "$path" ]] || return 1
              printf '%s\n' "$path"
            }
            extra+=(--filing-budget "$GARP_INPUT_FILING_BUDGET" --source-dir "$RUNNER_TEMP/garp-filing-originals")
            if [[ -n "$GARP_INPUT_MARKET" && "$GARP_INPUT_MARKET" != All ]]; then
              extra+=(--markets "$GARP_INPUT_MARKET")
            fi
            for setting in GARP_INPUT_FILING_REQUESTS GARP_INPUT_DART_REQUESTS GARP_INPUT_VENDOR_EXPORT GARP_INPUT_GEMINI_APPROVALS GARP_INPUT_CLASSIFICATION; do
              [[ -n "${!setting}" ]] || continue
              path="$(checked_csv "${!setting}")" || {
                printf '::error::%s must point to a CSV inside the checkout.\n' "$setting"
                exit 2
              }
              case "$setting" in
                GARP_INPUT_FILING_REQUESTS) extra+=(--official-filing-requests "$path");;
                GARP_INPUT_DART_REQUESTS) extra+=(--opendart-requests "$path");;
                GARP_INPUT_VENDOR_EXPORT) extra+=(--vendor-export "$path");;
                GARP_INPUT_GEMINI_APPROVALS) extra+=(--approved-sources "$path");;
                GARP_INPUT_CLASSIFICATION) extra+=(--classification "$path");;
              esac
            done
            if [[ "$GARP_DOSSIER" == 1 ]]; then
              extra+=(--research-dossier)
            fi
            if [[ "$GARP_INPUT_GEMINI" == true ]]; then
              [[ -z "$GARP_GEMINI_MAX_COST" ]] || extra+=(--gemini-max-cost-usd "$GARP_GEMINI_MAX_COST")
              extra+=(--enable-gemini --max-documents "$GARP_INPUT_GEMINI_MAX_DOCUMENTS" --max-requests "$GARP_INPUT_GEMINI_MAX_REQUESTS")
              extra+=(--gemini-cache "$RUNNER_TEMP/garp-gemini.sqlite")
              [[ -z "$GARP_GEMINI_MODEL" ]] || extra+=(--model "$GARP_GEMINI_MODEL")
              [[ -z "$GARP_GEMINI_TOTAL_INPUT_BUDGET" ]] || extra+=(--gemini-total-input-budget "$GARP_GEMINI_TOTAL_INPUT_BUDGET")
              [[ -z "$GARP_GEMINI_TOTAL_OUTPUT_BUDGET" ]] || extra+=(--gemini-total-output-budget "$GARP_GEMINI_TOTAL_OUTPUT_BUDGET")
              [[ -z "$GARP_GEMINI_INPUT_PRICE" ]] || extra+=(--gemini-input-price "$GARP_GEMINI_INPUT_PRICE")
              [[ -z "$GARP_GEMINI_OUTPUT_PRICE" ]] || extra+=(--gemini-output-price "$GARP_GEMINI_OUTPUT_PRICE")
              if [[ "$GARP_INPUT_GEMINI_APPROVED_ONLY" == true ]]; then
                extra+=(--gemini-approved-only)
              fi
            fi
          fi
          if [[ -n "$GARP_INPUT_ASOF" ]]; then
            extra+=(--asof-date "$GARP_INPUT_ASOF")
          fi
          "${engine[@]}" "${extra[@]}" \
            --max-symbols "$GARP_INPUT_MAX_SYMBOLS" \
            --discover-mode "$GARP_INPUT_DISCOVER_MODE" \
            --per-region "$GARP_INPUT_PER_REGION" \
            --fx-mode "$GARP_INPUT_FX_MODE" \
            --evidence-mode "$GARP_INPUT_EVIDENCE_MODE" \
            --evidence-limit 8 \
            --delay-seconds 0.7 \
            --output outputs
      - name: Listing discovery only
        if: ${{ inputs.discovery_only || inputs.cycle_mode == 'initialize' }}
        env:
          GARP_CYCLE_INITIALIZE: ${{ inputs.cycle_mode == 'initialize' }}
          GARP_CYCLE_DISCOVERY_SUPPLEMENT: ${{ inputs.per_region }}
          GARP_CYCLE_EXPLICIT: ${{ inputs.full_universe }}
          GARP_CYCLE_ARTIFACTS: ${{ vars.GARP_ALLOW_FINANCIAL_CHECKPOINT_ARTIFACTS }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          KRX_BASE_DATE: ${{ vars.KRX_BASE_DATE }}
          GARP_LISTING_EXPORT_DIR: ${{ vars.GARP_LISTING_EXPORT_DIR }}
          GARP_VALIDATED_CHINA_PUBLISHER_DIR: ${{ steps.listing_bundle.outputs.publisher_dir }}
          QUANTSONAR_API_KEY: ${{ secrets.QUANTSONAR_API_KEY }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          GARP_TUSHARE_EXPORT_DIR: ${{ vars.GARP_TUSHARE_EXPORT_DIR }}
          GARP_VALIDATED_CHINA_VENDOR_DIR: ${{ steps.listing_bundle.outputs.vendor_dir }}
          GARP_BAOSTOCK_SNAPSHOT: ${{ vars.GARP_BAOSTOCK_SNAPSHOT }}
          GARP_CHINA_PROVIDER_PROBE: ${{ inputs.china_provider_probe && '1' || '0' }}
          GARP_EASTMONEY_PROBE_ALLOWED: ${{ vars.GARP_EASTMONEY_PROBE_ALLOWED }}
          GARP_CHINA_ONLY: ${{ inputs.china_only }}
        run: |
          if [[ "$GARP_CYCLE_INITIALIZE" == true && ( "$GARP_CYCLE_EXPLICIT" != true || "$GARP_CYCLE_ARTIFACTS" != 1 || "$GARP_CHINA_ONLY" == true ) ]]; then
            echo 'Cycle initialization requires full_universe, approved artifacts, and five-market discovery.'
            exit 2
          fi
          if [[ "$GARP_CHINA_ONLY" == true ]]; then
            python -m src.discovery_smoke --output outputs --china-only
          elif [[ "$GARP_CYCLE_INITIALIZE" == true ]]; then
            python -m src.discovery_smoke --output outputs --per-region "$GARP_CYCLE_DISCOVERY_SUPPLEMENT"
          else
            python -m src.discovery_smoke --output outputs
          fi
      - name: Require quality audit & zero autonomous trading
        if: ${{ !inputs.discovery_only && inputs.cycle_mode == 'off' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('outputs/67_v06_run_manifest.json')
          if manifest.is_file():
              result = json.loads(manifest.read_text())
              assert result['trade_orders'] == 'NONE'
              assert result['predictive_validation'] == 'NOT_PERFORMED'
              print('Run status:', result['run_status'])
              print('Measured outcomes:', json.dumps(result['outcomes'], ensure_ascii=False))
              print('Gemini:', result['gemini']['status'], 'responses:', result['gemini'].get('api_responses_received', 0))
              assert result['outcomes']['research_report_files']['succeeded'] == 2
              if result['run_status'] in {'PARTIAL_PROVIDER_FAILURE', 'BLOCKED_EXTERNAL_DEPENDENCY'}:
                  print('::warning::Provider coverage incomplete for the selected scope. See 60_financial_coverage.csv')
              if not Path('outputs/34_research_quality_v05.json').is_file():
                  assert result['run_status'] == 'BLOCKED_EXTERNAL_DEPENDENCY'
                  raise SystemExit(0)
          q=json.loads(Path('outputs/34_research_quality_v05.json').read_text())
          assert q['trade_orders']=='NONE'
          assert q['future_return_predictive_validation']=='NOT_PERFORMED'
          r=json.loads(Path('outputs/42_research_readiness_v051.json').read_text())
          assert r['official_financial_figures_machine_verified_n']==0
          assert r['full_five_market_census_verified'] is False
          assert r['trades_executed'] is False
          assert Path('outputs/44_v051_run_manifest.json').is_file()
          print('PASS stage gate:',q['screened_n'],'screened,',q['memo_ready_n'],'memo ready')
          if r['market_coverage_status']=='PARTIAL_COVERAGE':
              print('::warning::PARTIAL_COVERAGE — missing official listings for', ','.join(r['markets_without_retrieved_official_issuer_list']))
          print('Market coverage:',r['market_coverage_status'],'dominant:',r['dominant_market'],r['dominant_market_share_pct'])
          PY
      - name: Probe representative financial-provider symbols
        if: ${{ inputs.discovery_only && inputs.china_only && vars.GARP_CHINA_FINANCE_PROBE == '1' }}
        run: python -m src.china_finance_probe --output outputs/54_china_financial_provider_probe.csv
      - name: Include private listing bundle validation summary
        if: ${{ !cancelled() && steps.listing_bundle.outcome == 'success' }}
        run: |
          summary="$RUNNER_TEMP/garp-validated-inputs/bundle_validation.json"
          if [[ -f "$summary" ]]; then
            mkdir -p outputs
            cp -- "$summary" outputs/53_china_import_validation.json
          fi
      - name: Freeze immutable financial schedule
        if: ${{ inputs.cycle_mode == 'initialize' }}
        env:
          GARP_SHARD_SIZE: ${{ vars.GARP_CYCLE_SHARD_SIZE || '100' }}
          GARP_CLASSIFICATION: ${{ vars.GARP_CLASSIFICATION_REGISTRY }}
        run: |
          extra=()
          if [[ -n "$GARP_CLASSIFICATION" ]]; then
            path="$(realpath -e -- "$GARP_CLASSIFICATION")"
            [[ "$path" == "$GITHUB_WORKSPACE/"*.csv && -f "$path" ]]
            extra+=(--classification "$path")
          fi
          python -m src.research_cycle freeze --input outputs --plan cycle-plan \
            --cycle-id "$GITHUB_RUN_ID" --shard-size "$GARP_SHARD_SIZE" "${extra[@]}"
      - name: Publish cycle plan
        if: ${{ inputs.cycle_mode == 'initialize' }}
        uses: actions/upload-artifact@v4
        with:
          name: garp-cycle-${{ github.run_id }}-plan
          path: cycle-plan/
          overwrite: false
          retention-days: 90
          if-no-files-found: error
      - name: Upload research artifacts (including troubleshooting artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-garp-v06-${{ github.run_id }}
          path: outputs/
          retention-days: 30
          if-no-files-found: warn

  cycle_prepare:
    if: ${{ inputs.cycle_mode == 'batch' || inputs.cycle_mode == 'aggregate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      jobs: ${{ steps.prepare.outputs.jobs }}
      reserved: ${{ steps.prepare.outputs.reserved }}
      quota_date: ${{ steps.prepare.outputs.quota_date }}
      provider_version: ${{ steps.prepare.outputs.provider_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore durable shard checkpoints and reserve provider quota
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GARP_CYCLE: ${{ inputs.cycle_state }}
          GARP_CYCLE_MODE: ${{ inputs.cycle_mode }}
          GARP_CYCLE_MARKET: ${{ inputs.cycle_market }}
          GARP_CYCLE_EXPLICIT: ${{ inputs.full_universe }}
          GARP_CYCLE_ARTIFACTS: ${{ vars.GARP_ALLOW_FINANCIAL_CHECKPOINT_ARTIFACTS }}
          GARP_CYCLE_JOB_BUDGET: ${{ inputs.financial_budget }}
          GARP_CYCLE_DAILY_BUDGET: ${{ vars.GARP_CYCLE_DAILY_BUDGET }}
          GARP_CYCLE_MAX_SHARDS: ${{ vars.GARP_CYCLE_MAX_SHARDS || '4' }}
        run: bash .github/scripts/restore-research-cycle.sh
      - name: Publish quota reservation before workers start
        if: ${{ steps.prepare.outputs.jobs != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: garp-cycle-${{ inputs.cycle_state }}-quota-${{ steps.prepare.outputs.quota_date }}-${{ steps.prepare.outputs.reserved }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cycle-quota.json
          retention-days: 2
          if-no-files-found: error
      - name: Publish restored working set
        uses: actions/upload-artifact@v4
        with:
          name: garp-cycle-working-${{ github.run_attempt }}
          path: cycle-working/
          retention-days: 2
          if-no-files-found: error

  cycle_worker:
    if: ${{ needs.cycle_prepare.outputs.jobs != '0' && inputs.cycle_mode == 'batch' }}
    needs: cycle_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.GARP_CYCLE_PARALLELISM || '2') }}
      matrix: ${{ fromJSON(needs.cycle_prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install provider version pinned to the snapshot
        env:
          GARP_PROVIDER_VERSION: ${{ needs.cycle_prepare.outputs.provider_version }}
        run: |
          [[ "$GARP_PROVIDER_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)*$ ]]
          python -m pip install -r requirements.txt "yfinance==$GARP_PROVIDER_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: garp-cycle-working-${{ github.run_attempt }}
          path: cycle-working
      - name: Run reserved shard
        env:
          GARP_SHARD: ${{ matrix.shard }}
          GARP_BUDGET: ${{ matrix.budget }}
          GARP_QUOTA_DATE: ${{ needs.cycle_prepare.outputs.quota_date }}
          GARP_DELAY: ${{ vars.GARP_CYCLE_REQUEST_DELAY || '2' }}
        run: |
          python -m src.research_cycle work --plan cycle-working/plan --state cycle-working/state \
            --shard "$GARP_SHARD" --budget "$GARP_BUDGET" --quota-date "$GARP_QUOTA_DATE" --delay "$GARP_DELAY"
      - name: Publish independently recoverable shard checkpoint
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: garp-cycle-${{ inputs.cycle_state }}-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: cycle-working/state/${{ matrix.shard }}.sqlite
          retention-days: 90

  cycle_report:
    if: ${{ always() && !cancelled() && needs.cycle_prepare.result == 'success' }}
    needs: [cycle_prepare, cycle_worker]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-gemini.txt
      - uses: actions/download-artifact@v4
        with:
          name: garp-cycle-working-${{ github.run_attempt }}
          path: cycle-working
      - name: Restore current workers
        if: ${{ needs.cycle_prepare.outputs.jobs != '0' }}
        uses: actions/download-artifact@v4
        with:
          pattern: garp-cycle-${{ inputs.cycle_state }}-shard-*-${{ github.run_attempt }}
          path: fresh-shards
      - name: Build deterministic cycle report
        env:
          GARP_CLASSIFICATION: ${{ vars.GARP_CLASSIFICATION_REGISTRY }}
          GARP_FILING_REQUESTS: ${{ inputs.cycle_mode == 'aggregate' && inputs.official_filing_requests || '' }}
          GARP_VENDOR_EXPORT: ${{ inputs.cycle_mode == 'aggregate' && vars.GARP_FILING_VENDOR_EXPORT || '' }}
          GARP_DART_REQUESTS: ${{ inputs.cycle_mode == 'aggregate' && vars.GARP_OPENDART_REQUESTS || '' }}
          GARP_APPROVALS: ${{ inputs.cycle_mode == 'aggregate' && inputs.gemini_approved_sources || '' }}
          GARP_ENABLE_MODEL: ${{ inputs.cycle_mode == 'aggregate' && inputs.enable_gemini }}
          GARP_DOSSIER: ${{ inputs.cycle_mode == 'aggregate' && vars.GARP_RESEARCH_DOSSIER || '' }}
          GARP_GEMINI_MAX_COST: ${{ vars.GARP_GEMINI_MAX_COST_USD }}
          GARP_GEMINI_INPUT_PRICE: ${{ vars.GARP_GEMINI_INPUT_PRICE }}
          GARP_GEMINI_OUTPUT_PRICE: ${{ vars.GARP_GEMINI_OUTPUT_PRICE }}
          GARP_APPROVED_ONLY: ${{ inputs.gemini_approved_only }}
          GARP_MAX_DOCS: ${{ inputs.gemini_max_documents }}
          GARP_MAX_CALLS: ${{ inputs.gemini_max_requests }}
          GARP_FILING_BUDGET: ${{ inputs.filing_budget }}
          GARP_GEMINI_MODEL: ${{ vars.GARP_GEMINI_MODEL }}
          DART_API_KEY: ${{ inputs.cycle_mode == 'aggregate' && secrets.DART_API_KEY || '' }}
          EDINET_API_KEY: ${{ inputs.cycle_mode == 'aggregate' && inputs.official_filing_requests != '' && secrets.EDINET_API_KEY || '' }}
          GEMINI_API_KEY: ${{ inputs.cycle_mode == 'aggregate' && inputs.enable_gemini && secrets.GEMINI_API_KEY || '' }}
        run: |
          mkdir -p fresh-shards
          python -m src.research_cycle restore --plan cycle-working/plan --state cycle-working/state --input fresh-shards
          extra=()
          for setting in GARP_CLASSIFICATION GARP_FILING_REQUESTS GARP_VENDOR_EXPORT GARP_DART_REQUESTS GARP_APPROVALS; do
            [[ -n "${!setting}" ]] || continue
            path="$(realpath -e -- "${!setting}")"
            [[ "$path" == "$GITHUB_WORKSPACE/"*.csv && -f "$path" ]]
            case "$setting" in
              GARP_CLASSIFICATION) extra+=(--classification "$path");;
              GARP_FILING_REQUESTS) extra+=(--official-filing-requests "$path");;
              GARP_VENDOR_EXPORT) extra+=(--vendor-export "$path");;
              GARP_DART_REQUESTS) extra+=(--opendart-requests "$path");;
              GARP_APPROVALS) extra+=(--approved-sources "$path");;
            esac
          done
          extra+=(--source-dir "$RUNNER_TEMP/garp-cycle-originals" --filing-budget "$GARP_FILING_BUDGET")
          if [[ "$GARP_DOSSIER" == 1 ]]; then extra+=(--research-dossier); fi
          if [[ "$GARP_ENABLE_MODEL" == true ]]; then
            [[ -z "$GARP_GEMINI_MAX_COST" ]] || extra+=(--gemini-max-cost-usd "$GARP_GEMINI_MAX_COST")
            [[ -z "$GARP_GEMINI_INPUT_PRICE" ]] || extra+=(--gemini-input-price "$GARP_GEMINI_INPUT_PRICE")
            [[ -z "$GARP_GEMINI_OUTPUT_PRICE" ]] || extra+=(--gemini-output-price "$GARP_GEMINI_OUTPUT_PRICE")
            extra+=(--enable-gemini --max-documents "$GARP_MAX_DOCS" --max-requests "$GARP_MAX_CALLS"
              --gemini-cache "$RUNNER_TEMP/garp-cycle-gemini.sqlite")
            if [[ "$GARP_APPROVED_ONLY" == true ]]; then extra+=(--gemini-approved-only); fi
          fi
          python -m src.research_cycle aggregate --plan cycle-working/plan --state cycle-working/state \
            --output cycle-report "${extra[@]}"
      - name: Publish rolled-up durable checkpoint
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: garp-cycle-${{ inputs.cycle_state }}-state-${{ github.run_attempt }}
          path: cycle-working/state/
          retention-days: 90
      - name: Publish cycle coverage and research artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: garp-cycle-${{ inputs.cycle_state }}-report-${{ github.run_attempt }}
          path: cycle-report/
          retention-days: 30
