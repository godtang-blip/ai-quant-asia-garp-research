name: Asia GARP Research v0.3 — Manual Only
on:
  workflow_dispatch:
    inputs:
      max_symbols:
        description: 'Max to FETCH (0=all discovered; 90 recommended to begin). Curated 61 first.'
        required: true
        type: string
        default: '90'
      discover_mode:
        description: 'off=curated 61, nikkei=official Nikkei 225, regional=yfinance regions, both=both'
        required: true
        type: choice
        options:
          - nikkei
          - regional
          - both
          - off
        default: nikkei
      fx_mode:
        description: 'live=dated FX source, off=do not convert without sourced FX'
        required: true
        type: choice
        options:
          - live
          - off
        default: live
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Execute offline regression tests (no broker, no trades)
        run: python -m pytest -q tests
      - name: Run version 0.3 (RESEARCH ONLY)
        run: |
          python -m src.v03 --max-symbols "${{ inputs.max_symbols }}" --discover-mode "${{ inputs.discover_mode }}" --fx-mode "${{ inputs.fx_mode }}" --output outputs --delay-seconds 1.0
      - name: Upload reproducible outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-garp-research-v03-${{ github.run_id }}
          path: outputs/
          retention-days: 30
          if-no-files-found: warn
