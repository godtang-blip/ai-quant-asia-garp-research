name: Asia GARP Research v0.2 — Manual Only
on:
  workflow_dispatch:
    inputs:
      max_symbols:
        description: 'Balanced market sample: 12 (4 industries), 24 (8), 0 (all 61).'
        type: string
        required: true
        default: '24'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test selection, scoring and data triage
        run: python -m pytest -q tests
      - name: Run balanced multi-industry research (NO TRADES)
        run: python -m src.screen --max-symbols "${{ inputs.max_symbols }}" --output outputs --delay-seconds 1.5
      - name: Upload reproducible results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: asia-garp-research-v02-${{ github.run_id }}
          path: outputs/
          retention-days: 30
          if-no-files-found: error
