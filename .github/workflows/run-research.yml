name: Asia GARP Research — Manual Only
on:
  workflow_dispatch:
    inputs:
      max_symbols:
        description: 'How many curated companies? 0 = all (start with 10-12)'
        type: string
        required: true
        default: '12'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check ranking logic
        run: python -m pytest -q tests
      - name: Collect exploratory fundamental snapshots
        run: python -m src.screen --max-symbols "${{ inputs.max_symbols }}" --output outputs
      - name: Export research CSV and Markdown (no trading state)
        uses: actions/upload-artifact@v4
        with:
          name: asia-garp-research-${{ github.run_id }}
          path: outputs/
          retention-days: 30
          if-no-files-found: error
